name: M2 bounded public-source observations
on:
  workflow_dispatch:
    inputs:
      openfoot_starter:
        description: 'Optional exact AUDIT_OPENFOOT_FREE to check own $0 Starter key; never import'
        required: false
        type: string
      openfoot_rounds:
        description: 'Optional exact AUDIT_OPENFOOT_ROUNDS: at most 30 free round-filter requests; no import'
        required: false
        type: string
  issue_comment:
    types: [created]

permissions: {contents: read}
concurrency:
  group: m2-public-sources-observation
  cancel-in-progress: false

jobs:
  pinned-openfootball:
    if: >-
      github.repository == 'StanleyLl0yd/FootballForecast' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'StanleyLl0yd' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.number == 182 &&
          !github.event.issue.pull_request &&
          github.event.comment.user.login == 'StanleyLl0yd' &&
          github.event.comment.author_association == 'OWNER' &&
          github.event.comment.body == '/m2-public-sources'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '22'}
      - name: Verify exact pinned public historical reference without row retention
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 25 --max-filesize 200000 \
            --output "$work/openfootball.txt" \
            'https://raw.githubusercontent.com/openfootball/europe/63df627f3c87ce71708f016522ea236cf74332c3/russia/2024-25_ru1.txt'
          test -s "$work/openfootball.txt"
          node scripts/m2-openfootball-reference.mjs "$work/openfootball.txt" > "$work/aggregate.json"
          echo "M2_OPENFOOTBALL_OBSERVATION=$(cat "$work/aggregate.json")"
          {
            echo '## OpenFootball 2024/25: exact pinned public reference'
            echo 'Independent published-reference structure only; NOT source independence, approved M2 model input or holdout access.'
            echo 'OpenFootball CC0: https://github.com/openfootball/europe'
            echo '~~~json'
            cat "$work/aggregate.json"
            echo
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  bounded-sportscore-current:
    if: >-
      github.repository == 'StanleyLl0yd/FootballForecast' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'StanleyLl0yd' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.number == 182 &&
          !github.event.issue.pull_request &&
          github.event.comment.user.login == 'StanleyLl0yd' &&
          github.event.comment.author_association == 'OWNER' &&
          github.event.comment.body == '/m2-public-sources'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '22'}
      - name: Observe one UTC day from free attributed RPL API without Footbolno
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          day="$(date -u +%F)"
          observed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo '## SportScore: independent, on-demand, single-UTC-day research'
            echo 'Attribution: <a href="https://sportscore.com/" rel="dofollow">Powered by SportScore</a>'
            echo 'Free API terms: https://sportscore.com/developers/terms/'
            echo 'No scheduled polling, bulk ingestion, historical training, source switching, live score overwrite or holdout access.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          search_status="$(curl --silent --show-error --fail --proto '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 20 --max-filesize 200000 \
            -H 'Accept: application/json' \
            -H 'User-Agent: FootballForecastM2Research/1.0 (https://github.com/StanleyLl0yd/FootballForecast)' \
            --output "$work/search.json" --write-out '%{http_code}' \
            'https://sportscore.com/api/v1/search/?q=Russian%20Premier%20League&sport=football&limit=10' \
            2>/dev/null || true)"
          if [[ "$search_status" != 200 ]]; then
            echo 'SportScore search unavailable: INCONCLUSIVE (not zero fixtures).' >> "$GITHUB_STEP_SUMMARY"
            echo 'M2_SPORTSCORE_OBSERVATION=INCONCLUSIVE_SEARCH'
            exit 0
          fi
          node scripts/m0-sportscore-filtered-rpl-research.mjs \
            discover "$work/search.json" "$work/slug.txt" > "$work/search-summary.json"
          if [[ ! -s "$work/slug.txt" ]]; then
            echo 'No unique validated competition: INCONCLUSIVE.' >> "$GITHUB_STEP_SUMMARY"
            echo 'M2_SPORTSCORE_OBSERVATION=INCONCLUSIVE_COMPETITION'
            exit 0
          fi
          slug="$(cat "$work/slug.txt")"
          [[ "$slug" =~ ^[a-z0-9][a-z0-9-]{2,79}$ ]]
          daily_status="$(curl --silent --show-error --fail --proto '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 20 --max-filesize 1000000 \
            -H 'Accept: application/json' \
            -H 'User-Agent: FootballForecastM2Research/1.0 (https://github.com/StanleyLl0yd/FootballForecast)' \
            --output "$work/day.json" --write-out '%{http_code}' \
            "https://sportscore.com/api/v1/fixtures/?sport=football&date=$day&competition=$slug&limit=200" \
            2>/dev/null || true)"
          if [[ "$daily_status" != 200 ]]; then
            echo 'SportScore day response unavailable: INCONCLUSIVE (not zero fixtures).' >> "$GITHUB_STEP_SUMMARY"
            echo 'M2_SPORTSCORE_OBSERVATION=INCONCLUSIVE_DAY'
            exit 0
          fi
          node scripts/m2-sportscore-observe.mjs \
            "$work/search.json" "$work/day.json" "$day" "$observed" > "$work/aggregate.json"
          echo "M2_SPORTSCORE_OBSERVATION=$(cat "$work/aggregate.json")"
          {
            echo '~~~json'
            cat "$work/aggregate.json"
            echo
            echo '~~~'
            echo 'Only provider-observed aggregate counts; not independent official score truth or verified full-day coverage.'
          } >> "$GITHUB_STEP_SUMMARY"

  bounded-openfoot-rpl-demo:
    # One documentation-published free demo GET; NEVER a production integration.
    if: >-
      github.repository == 'StanleyLl0yd/FootballForecast' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'StanleyLl0yd' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.number == 182 &&
          !github.event.issue.pull_request &&
          github.event.comment.user.login == 'StanleyLl0yd' &&
          github.event.comment.author_association == 'OWNER' &&
          github.event.comment.body == '/m2-public-sources'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '22'}
      - name: Observe one explicit RPL season from published free OpenFoot demo
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          observed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo '## OpenFoot API free public documentation demo — RPL 2026/27'
            echo 'Provider: https://openfootapi.com/docs'
            echo 'Terms and upstream-provider constraints: https://openfootapi.com/terms'
            echo 'Public documentation demo key; one explicit competition/season GET, no account, costs, secrets, storage or bulk queries.'
            echo 'No training, model approval, automatic feeds, current-season writes, historical holdout access or publication.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # Documentation-published public demo value; no private key, no log output.
          printf 'header = "Authorization: Bearer %s%s"\n' \
            'of_demo_' 'openfootapi_docs' > "$work/demo-curl.conf"
          status="$(curl --fail --silent --show-error \
            --proto '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 20 --max-filesize 1200000 \
            -H 'Accept: application/json' \
            --config "$work/demo-curl.conf" \
            -H 'User-Agent: FootballForecastM2Research/1.0 (https://github.com/StanleyLl0yd/FootballForecast)' \
            --output "$work/day.json" --write-out '%{http_code}' \
            'https://openfootapi.com/v1/matches?competition=comp_premier_league_rus&season=2026%2F27' \
            2>/dev/null || true)"
          if [[ "$status" != '200' || ! -s "$work/day.json" ]]; then
            echo 'OpenFoot demo HTTP source unavailable: INCONCLUSIVE, not zero RPL fixtures.' >> "$GITHUB_STEP_SUMMARY"
            echo 'M2_OPENFOOT_OBSERVATION=INCONCLUSIVE_HTTP'
            exit 0
          fi
          if ! node scripts/m2-openfoot-rpl-diagnostic.mjs \
            "$work/day.json" "$observed" > "$work/aggregate.json"; then
            echo 'OpenFoot demo response did not pass bounded RPL schema: INCONCLUSIVE, no provider rows retained.' >> "$GITHUB_STEP_SUMMARY"
            echo 'M2_OPENFOOT_OBSERVATION=INCONCLUSIVE_SCHEMA'
            exit 0
          fi
          echo "M2_OPENFOOT_OBSERVATION=$(cat "$work/aggregate.json")"
          {
            echo '~~~json'
            cat "$work/aggregate.json"
            echo
            echo '~~~'
            echo 'Only a provider-observed aggregate. A demo response is not certified full-season coverage, verified upstream rights or production source approval.'
          } >> "$GITHUB_STEP_SUMMARY"

  bounded-openfoot-free-starter:
    # Explicit owner workflow_dispatch only; no issue-comment secret access.
    if: >-
      github.repository == 'StanleyLl0yd/FootballForecast' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'StanleyLl0yd' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.openfoot_starter == 'AUDIT_OPENFOOT_FREE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '22'}
      - name: Audit one authenticated free Starter RPL season response without retaining rows
        shell: bash
        env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          {
            echo '## OpenFoot API owner-authenticated $0 Starter — one-off RPL coverage audit'
            echo 'https://openfootapi.com/terms — internal research permitted, upstream rights separate.'
            echo 'No automatic ingestion, secret disclosure, holdout access or public forecasts.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "${OPENFOOT_API_KEY:-}" ]]; then
            echo 'M2_OPENFOOT_FREE_OBSERVATION=INCONCLUSIVE_NO_FREE_KEY'
            echo 'No repository secret OPENFOOT_API_KEY configured; request not sent.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$OPENFOOT_API_KEY" =~ ^of_live_[A-Za-z0-9_-]{8,256}$ ]]; then
            echo 'M2_OPENFOOT_FREE_OBSERVATION=INCONCLUSIVE_KEY_FORMAT'
            echo 'Refused non-Starter-key format; no request sent.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Write token only to a private temporary curl config; no stdout or runner trace.
          printf 'header = "Authorization: Bearer %s"\n' "$OPENFOOT_API_KEY" > "$work/key.conf"
          unset OPENFOOT_API_KEY
          observed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          status="$(curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 25 --max-filesize 1200000 \
            -H 'Accept: application/json' --config "$work/key.conf" \
            -H 'User-Agent: FootballForecastM2Research/1.0 (https://github.com/StanleyLl0yd/FootballForecast)' \
            --output "$work/day.json" --write-out '%{http_code}' \
            'https://openfootapi.com/v1/matches?competition=comp_premier_league_rus&season=2026%2F27' \
            2>/dev/null || true)"
          rm -f "$work/key.conf"
          if [[ "$status" != 200 || ! -s "$work/day.json" ]]; then
            echo 'M2_OPENFOOT_FREE_OBSERVATION=INCONCLUSIVE_HTTP'
            echo 'No valid free-provider HTTP response; no claim of missing fixtures.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! node scripts/m2-openfoot-rpl-diagnostic.mjs \
            "$work/day.json" "$observed" starter > "$work/aggregate.json"; then
            echo 'M2_OPENFOOT_FREE_OBSERVATION=INCONCLUSIVE_SCHEMA'
            echo 'Untrusted response failed bounded checks; no provider rows retained.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "M2_OPENFOOT_FREE_OBSERVATION=$(cat "$work/aggregate.json")"
          {
            echo '~~~json'
            cat "$work/aggregate.json"
            echo
            echo '~~~'
            echo 'Even 240/16 and free Starter do not authorize ingestion, model selection or forecasts.'
          } >> "$GITHUB_STEP_SUMMARY"

  bounded-openfoot-free-rounds:
    # One authenticated research GET per documented RPL matchday, never use paid cursor.
    if: >-
      github.repository == 'StanleyLl0yd/FootballForecast' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'StanleyLl0yd' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.openfoot_rounds == 'AUDIT_OPENFOOT_ROUNDS'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '22'}
      - name: Audit explicit RPL 2026/27 matchdays within free Starter quota
        shell: bash
        env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/rounds"
          {
            echo '## OpenFoot $0 Starter — explicitly filtered 30-round RPL 2026/27 research'
            echo '30 documented matchday filters; no Developer cursor, paid plan or quota bypass.'
            echo 'No provider records, credentials or club identities logged, uploaded or persisted.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "${OPENFOOT_API_KEY:-}" ]]; then
            echo 'M2_OPENFOOT_ROUNDS_OBSERVATION=INCONCLUSIVE_NO_FREE_KEY'
            echo 'Missing private API key: zero requests.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$OPENFOOT_API_KEY" =~ ^of_live_[A-Za-z0-9_-]{8,256}$ ]]; then
            echo 'M2_OPENFOOT_ROUNDS_OBSERVATION=INCONCLUSIVE_KEY_FORMAT'
            echo 'Unexpected key format; no request sent.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'header = "Authorization: Bearer %s"\n' "$OPENFOOT_API_KEY" > "$work/key.conf"
          unset OPENFOOT_API_KEY
          observed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for round in $(seq 1 30); do
            file="$work/rounds/$(printf '%02d' "$round").json"
            status="$(curl --silent --show-error --fail --proto '=https' --max-redirs 0 \
              --connect-timeout 8 --max-time 20 --max-filesize 180000 \
              --config "$work/key.conf" -H 'Accept: application/json' \
              -H 'User-Agent: FootballForecastM2Research/1.0 (https://github.com/StanleyLl0yd/FootballForecast)' \
              --output "$file" --write-out '%{http_code}' \
              "https://openfootapi.com/v1/matches?competition=comp_premier_league_rus&season=2026%2F27&round=$round" \
              2>/dev/null || true)"
            if [[ "$status" != 200 || ! -s "$file" ]]; then
              echo "M2_OPENFOOT_ROUNDS_OBSERVATION=INCONCLUSIVE_HTTP_ROUND_$round"
              echo 'Source refused a bounded round query; stop without retaining incomplete rows.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$round" == 1 ]]; then
              if ! node scripts/m2-openfoot-rpl-diagnostic.mjs "$file" "$observed" starter > "$work/tier.json"; then
                echo 'M2_OPENFOOT_ROUNDS_OBSERVATION=INCONCLUSIVE_FIRST_RESPONSE_SCHEMA'
                exit 0
              fi
              if ! node --input-type=module - "$work/tier.json" <<'FREE_TIER'
          import {readFileSync} from 'node:fs';
          const result=JSON.parse(readFileSync(process.argv[2],'utf8'));
          if(result.starterTierVerified!==true)process.exit(2);
          FREE_TIER
              then
                echo 'M2_OPENFOOT_ROUNDS_OBSERVATION=INCONCLUSIVE_NOT_FREE_STARTER'
                echo 'Further requests refused: authenticated free Starter only.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          done
          rm -f "$work/key.conf"
          if ! node scripts/m2-openfoot-round-audit.mjs "$work/rounds" "$observed" > "$work/aggregate.json"; then
            echo 'M2_OPENFOOT_ROUNDS_OBSERVATION=INCONCLUSIVE_SCHEMA'
            echo 'Bounded provider response invalid or inconsistent; no records retained.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "M2_OPENFOOT_ROUNDS_OBSERVATION=$(cat "$work/aggregate.json")"
          {
            echo '~~~json'
            cat "$work/aggregate.json"
            echo
            echo '~~~'
            echo 'Coverage research only; no source, holdout or forecast authorization.'
          } >> "$GITHUB_STEP_SUMMARY"
