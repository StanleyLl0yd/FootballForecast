name: M3 owner-only 480-fixture two-season correspondence
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'M3_480_CROSSWALK_AGGREGATE_ONLY — no holdout or publication'
        required: true
        type: string
  issue_comment:
    types: [created]
permissions: {contents: read}
concurrency:
  group: m3-owner-private-480-crosswalk
  cancel-in-progress: false
jobs:
  private-development:
    if: >-
      github.repository == 'StanleyLl0yd/FootballForecast' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'StanleyLl0yd' &&
      (
        (github.event_name == 'workflow_dispatch' &&
         inputs.confirmation == 'M3_480_CROSSWALK_AGGREGATE_ONLY') ||
        (github.event_name == 'issue_comment' &&
         github.event.action == 'created' &&
         github.event.issue.number == 271 &&
         !github.event.issue.pull_request &&
         github.event.comment.user.login == 'StanleyLl0yd' &&
         github.event.comment.author_association == 'OWNER' &&
         github.event.comment.body == '/m3-480-crosswalk-aggregate-only')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: m1-source-import
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - name: Install pinned database client
        run: python -m pip install -e ./ml 'psycopg[binary]==3.3.6'
      - name: Execute protected score-free two-season correlation
        shell: bash
        env:
          PGHOST: ${{ secrets.M1_PGHOST }}
          PGUSER: ${{ secrets.M1_PGUSER }}
          PGDATABASE: ${{ secrets.M1_PGDATABASE }}
          PGPASSWORD: ${{ secrets.M1_PGPASSWORD }}
          M1_PGROOTCERT_B64: ${{ secrets.M1_PGROOTCERT_B64 }}
          PYTHONPATH: ml/src
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == 'StanleyLl0yd/FootballForecast' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_ACTOR" == 'StanleyLl0yd' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          for name in PGHOST PGUSER PGDATABASE PGPASSWORD; do
            [[ -n "${!name:-}" ]] || { echo 'FAIL: protected DB credentials missing'; exit 2; }
          done
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          if [[ -n "${M1_PGROOTCERT_B64:-}" ]]; then
            printf '%s' "$M1_PGROOTCERT_B64" | base64 --decode > "$work/ca.crt"
          else
            cp security/certs/supabase-root-2021-ca.crt "$work/ca.crt"
          fi
          fingerprint="$(openssl x509 -in "$work/ca.crt" -outform DER | sha256sum | cut -d ' ' -f1)"
          [[ "$fingerprint" == '807025ad50d4ed219d2c9c7d299c004f824eb00cf7f65afef607d07b72e6cafa' ]] || {
            echo 'FAIL: untrusted Supabase CA'; exit 2;
          }
          openssl x509 -in "$work/ca.crt" -noout -checkend 86400 > /dev/null
          export PGSSLROOTCERT="$work/ca.crt"
          python scripts/m3-owner-two-season-crosswalk.py
