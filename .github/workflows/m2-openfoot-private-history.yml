name: M2 private seven-season RPL source archive
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ARCHIVE_PRIVATE_SEVEN_SEASONS (research only, no forecast)'
        required: true
        type: string
  issue_comment:
    types: [created]
permissions: {contents: read}
concurrency:
  group: m2-private-rpl-history-source-archive
  cancel-in-progress: false
jobs:
  seven-season-private-archive:
    if: >-
      github.repository == 'StanleyLl0yd/FootballForecast' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'StanleyLl0yd' &&
      (
        (github.event_name == 'workflow_dispatch' &&
         inputs.confirmation == 'ARCHIVE_PRIVATE_SEVEN_SEASONS') ||
        (github.event_name == 'issue_comment' &&
         github.event.action == 'created' &&
         github.event.issue.number == 182 &&
         !github.event.issue.pull_request &&
         github.event.comment.user.login == 'StanleyLl0yd' &&
         github.event.comment.author_association == 'OWNER' &&
         github.event.comment.body == '/m2-openfoot-private-archive')
      )
    runs-on: ubuntu-latest
    environment: m1-source-import
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '22'}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - name: Install pinned PostgreSQL client
        run: python -m pip install 'psycopg[binary]==3.3.6'
      - name: Independently verify and import private historical RPL cohort
        shell: bash
        env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
          PGHOST: ${{ secrets.M1_PGHOST }}
          PGUSER: ${{ secrets.M1_PGUSER }}
          PGDATABASE: ${{ secrets.M1_PGDATABASE }}
          PGPASSWORD: ${{ secrets.M1_PGPASSWORD }}
          M1_PGROOTCERT_B64: ${{ secrets.M1_PGROOTCERT_B64 }}
        run: bash scripts/m2-openfoot-private-history-run.sh
