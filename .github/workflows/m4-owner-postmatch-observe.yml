name: M4-A6 owner-only private postmatch result READONLY
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'M4_RESULT_READONLY only; no writes, no scoring'
        required: true
        type: string
  issue_comment:
    types: [created]
permissions: {contents: read}
concurrency:
  group: m4-a6-owner-postmatch-readonly
  cancel-in-progress: false
jobs:
  protected-private-result-readonly:
    if: >-
      github.repository == 'StanleyLl0yd/FootballForecast' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'StanleyLl0yd' &&
      github.actor_id == '131160519' &&
      github.triggering_actor == 'StanleyLl0yd' &&
      (
        (github.event_name == 'workflow_dispatch' &&
         inputs.confirmation == 'M4_RESULT_READONLY') ||
        (github.event_name == 'issue_comment' &&
         github.event.action == 'created' &&
         github.event.issue.number == 304 &&
         !github.event.issue.pull_request &&
         github.event.comment.user.id == 131160519 &&
         github.event.comment.user.login == 'StanleyLl0yd' &&
         github.event.comment.author_association == 'OWNER' &&
         github.event.comment.body == '/m4-result-readonly')
      )
    permissions: {contents: read, id-token: write}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: m1-source-import
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 pinned
        with: {python-version: '3.13'}
      - name: Install pinned private PostgreSQL client and RS256 verifier
        run: python -m pip install -e './ml[oidc]' 'psycopg[binary]==3.3.6'
      - name: Private A5-anchored live source check, GitHub OIDC; READONLY
        shell: bash
        env:
          M4_RESULT_READONLY_GATE: 'true'
          M4_RESULT_READONLY_MODE: M4_RESULT_READONLY
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
          PGHOST: ${{ secrets.M1_PGHOST }}
          PGUSER: ${{ secrets.M1_PGUSER }}
          PGDATABASE: ${{ secrets.M1_PGDATABASE }}
          PGPASSWORD: ${{ secrets.M1_PGPASSWORD }}
          M1_PGROOTCERT_B64: ${{ secrets.M1_PGROOTCERT_B64 }}
          PYTHONPATH: ml/src
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == 'StanleyLl0yd/FootballForecast' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_ACTOR" == 'StanleyLl0yd' ]]
          [[ "$GITHUB_ACTOR_ID" == '131160519' ]]
          [[ "$GITHUB_TRIGGERING_ACTOR" == 'StanleyLl0yd' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$M4_RESULT_READONLY_MODE" == 'M4_RESULT_READONLY' ]]
          [[ -n "${OPENFOOT_API_KEY:-}" ]]
          for name in PGHOST PGUSER PGDATABASE PGPASSWORD; do
            [[ -n "${!name:-}" ]] || { echo 'FAIL: protected private credential absent'; exit 2; }
          done
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          if [[ -n "${M1_PGROOTCERT_B64:-}" ]]; then
            printf '%s' "$M1_PGROOTCERT_B64" | base64 --decode > "$work/ca.crt"
          else
            cp security/certs/supabase-root-2021-ca.crt "$work/ca.crt"
          fi
          fingerprint="$(openssl x509 -in "$work/ca.crt" -outform DER | sha256sum | cut -d ' ' -f1)"
          [[ "$fingerprint" == '807025ad50d4ed219d2c9c7d299c004f824eb00cf7f65afef607d07b72e6cafa' ]] || {
            echo 'FAIL: private database root CA not pinned'; exit 2;
          }
          openssl x509 -in "$work/ca.crt" -noout -checkend 86400 >/dev/null
          export PGSSLROOTCERT="$work/ca.crt"
          python scripts/m4-owner-postmatch-observe.py > "$work/readonly-receipt.json"
          python - "$work/readonly-receipt.json" <<'PY'
          import json,os,re,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_bytes()
          if not 350<=len(raw)<=1200:
              raise SystemExit('FAIL: bounded postmatch readonly receipt invalid')
          row=json.loads(raw)
          exact={'kind','runId','codeSha','fixtures','forecasts','abstentions',
                 'candidates','batchTokenDigestSha256',
                 'openfootExplicitPlayedFieldCount',
                 'openfootUnknownPlayedFieldCount',
                 'matchtvUnknownPlayedFieldCount','sourceStatusSchemaOnly',
                 'githubDigestTimeVerified','publisherAuthenticityAttested',
                 'playedFinalAttested','databaseWrite','settlementAuthorized',
                 'scoringAuthorized','publicationAuthorized','holdout2025_26Read'}
          if (set(row)!=exact or
              row['kind']!='M4_PRIVATE_POSTMATCH_UNATTESTED_READONLY' or
              row['runId']!=os.environ['GITHUB_RUN_ID'] or
              row['codeSha']!=os.environ['GITHUB_SHA'] or
              any(type(row[k]) is not int for k in
                  ('fixtures','forecasts','abstentions','candidates')) or
              (row['fixtures'],row['forecasts'],row['abstentions'],row['candidates'])
                  !=(8,6,2,8) or
              any(type(row[k]) is not int for k in (
                  'openfootExplicitPlayedFieldCount','openfootUnknownPlayedFieldCount',
                  'matchtvUnknownPlayedFieldCount')) or
              not 0 <= row['openfootExplicitPlayedFieldCount'] <= 8 or
              not 0 <= row['openfootUnknownPlayedFieldCount'] <= 8 or
              row['openfootExplicitPlayedFieldCount']+
                  row['openfootUnknownPlayedFieldCount']!=8 or
              row['matchtvUnknownPlayedFieldCount']!=8 or
              row['sourceStatusSchemaOnly'] is not True or
              row['githubDigestTimeVerified'] is not True or
              not re.fullmatch(r'[a-f0-9]{64}',row['batchTokenDigestSha256']) or
              any(row[k] is not False for k in (
                  'publisherAuthenticityAttested','playedFinalAttested',
                  'databaseWrite','settlementAuthorized','scoringAuthorized',
                  'publicationAuthorized','holdout2025_26Read'))):
              raise SystemExit('FAIL: postmatch readonly receipt had an unauthorized claim')
          print('M4_A6_POSTMATCH_STATE='+row['kind'])
          print('M4_A6_TOKEN_RECEIPT_SHA256='+row['batchTokenDigestSha256'])
          print('M4_A6_OPENFOOT_EXPLICIT_PLAYED_FIELD_COUNT='+
                str(row['openfootExplicitPlayedFieldCount']))
          print('M4_A6_OPENFOOT_UNKNOWN_PLAYED_FIELD_COUNT='+
                str(row['openfootUnknownPlayedFieldCount']))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('## M4-A6 private read-only postmatch evidence\n')
              out.write('8 A5-anchored fixtures, 6 prospective FORECAST / 2 ABSTAIN; ')
              out.write('two distinct untrusted source bodies per fixture, ')
              out.write('GitHub-signed raw-response digest time.\n')
              out.write('OpenFoot explicit played field on '+
                        str(row['openfootExplicitPlayedFieldCount'])+
                        '/8; missing/unverified on '+
                        str(row['openfootUnknownPlayedFieldCount'])+
                        '/8. All MatchTV calendar played statuses UNKNOWN.\n')
              out.write('This is source-schema information, never certified truth.\n')
              out.write('No verified played-final truth, DB writes, scoring, ')
              out.write('holdout access or public forecasts.\n')
          PY
