name: M2 manual train-only research lock
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type LOCK_TRAIN_ONLY; no holdout labels or forecast publication'
        required: true
        type: string
      source_sha256:
        description: 'Exact approved Footbolno CSV SHA-256 of immutable private snapshot'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions: {contents: read}
concurrency:
  group: m2-manual-train-only-lock
  cancel-in-progress: false

jobs:
  private-lock:
    if: >-
      github.repository == 'StanleyLl0yd/FootballForecast' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'StanleyLl0yd' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'LOCK_TRAIN_ONLY') ||
        (github.event_name == 'issue_comment' && github.event.action == 'created' &&
         github.event.issue.number == 182 && !github.event.issue.pull_request &&
         github.event.comment.user.login == 'StanleyLl0yd' &&
         github.event.comment.author_association == 'OWNER' &&
         (github.event.comment.body == '/m2-lock 038fde66188771bccf40ef8b8a219b269fdfe5c30708c0d3243021ab00279a9f' ||
          (github.event.comment.body == '/m2-preflight 038fde66188771bccf40ef8b8a219b269fdfe5c30708c0d3243021ab00279a9f' ||
           github.event.comment.body == '/m2-candidate 038fde66188771bccf40ef8b8a219b269fdfe5c30708c0d3243021ab00279a9f')))
      )
    runs-on: ubuntu-latest
    environment: m1-source-import
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '22'}
      - name: Install reviewed small research dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ./ml 'psycopg[binary]==3.3.6'
      - name: Verify pinned exact-source comparison and fit private train only
        shell: bash
        env:
          PGHOST: ${{ secrets.M1_PGHOST }}
          PGUSER: ${{ secrets.M1_PGUSER }}
          PGDATABASE: ${{ secrets.M1_PGDATABASE }}
          PGPASSWORD: ${{ secrets.M1_PGPASSWORD }}
          M1_PGROOTCERT_B64: ${{ secrets.M1_PGROOTCERT_B64 }}
          M2_SOURCE_SHA: ${{ github.event_name == 'issue_comment' && '038fde66188771bccf40ef8b8a219b269fdfe5c30708c0d3243021ab00279a9f' || inputs.source_sha256 }}
          M2_PREFLIGHT: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/m2-preflight 038fde66188771bccf40ef8b8a219b269fdfe5c30708c0d3243021ab00279a9f' }}
          M2_CANDIDATE: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/m2-candidate 038fde66188771bccf40ef8b8a219b269fdfe5c30708c0d3243021ab00279a9f' }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$M2_SOURCE_SHA" =~ ^[a-f0-9]{64}$ ]] || { echo 'FAIL: invalid pinned CSV identity'; exit 2; }
          [[ -n "$PGHOST" && -n "$PGUSER" && -n "$PGDATABASE" && -n "$PGPASSWORD" ]] || {
            echo 'FAIL: protected PostgreSQL credentials unavailable'; exit 2;
          }
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          if [[ -n "$M1_PGROOTCERT_B64" ]]; then
            printf '%s' "$M1_PGROOTCERT_B64" | base64 --decode > "$work/ca.crt"
          else
            cp security/certs/supabase-root-2021-ca.crt "$work/ca.crt"
          fi
          fingerprint="$(openssl x509 -in "$work/ca.crt" -outform DER | sha256sum | cut -d ' ' -f1)"
          [[ "$fingerprint" == '807025ad50d4ed219d2c9c7d299c004f824eb00cf7f65afef607d07b72e6cafa' ]] || {
            echo 'FAIL: pinned PostgreSQL CA mismatch'; exit 2;
          }
          openssl x509 -in "$work/ca.crt" -noout -checkend 86400 >/dev/null
          export PGSSLROOTCERT="$work/ca.crt"
          if [[ "$M2_PREFLIGHT" == 'true' ]]; then
            echo 'M2 offline preflight: validating existing pinned private train rows only, no model fitting or source download.'
            python -m football_forecast.research.runner --preflight > "$work/preflight.json"
            node --input-type=module - "$work/preflight.json" <<'M2_PREFLIGHT_CHECK'
          import {readFileSync} from 'node:fs';
          const path=process.argv[2], b=readFileSync(path);
          if(!b.length||b.length>4096)throw Error('Invalid aggregate preflight bytes');
          const v=JSON.parse(b.toString('utf8'));
          const fields=['schemaVersion','kind','codeSha','sourceSha256',
            'snapshotIdentitySha256','trainingMatches','trainingClubs','storedTrainOnly',
            'externalSourceRechecked','modelFitted','holdoutRead','historicalPrematchVerified'];
          if(Object.keys(v).length!==fields.length||
             Object.keys(v).some(key=>!fields.includes(key))||
             v.schemaVersion!==1||v.kind!=='M2_STORED_TRAIN_PREFLIGHT'||
             !/^[a-f0-9]{40}$/.test(v.codeSha)||!/^[a-f0-9]{64}$/.test(v.sourceSha256)||
             !/^[a-f0-9]{64}$/.test(v.snapshotIdentitySha256)||
             v.trainingMatches!==240||v.trainingClubs!==16||
             v.storedTrainOnly!==true||v.externalSourceRechecked!==false||
             v.modelFitted!==false||v.holdoutRead!==false||
             v.historicalPrematchVerified!==false)
            throw Error('Untrusted private preflight aggregate');
          M2_PREFLIGHT_CHECK
            echo "M2_PRIVATE_PREFLIGHT_JSON=$(cat "$work/preflight.json")"
            echo "M2_PRIVATE_PREFLIGHT_SHA256=$(sha256sum "$work/preflight.json" | cut -d ' ' -f1)"
            {
              echo '## M2 existing snapshot preflight — NOT a real training run'
              echo 'Verified stored train only; publisher CSV was NOT fetched or reverified.'
              echo 'No holdout identity/labels, model fit or forecast write.'
              echo '~~~json'
              cat "$work/preflight.json"
              echo
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$M2_CANDIDATE" == 'true' ]]; then
            echo 'M2 stored-source candidate: ephemeral train-only fit, no holdout or publisher download.'
            python -m football_forecast.research.runner --candidate > "$work/candidate.json"
            node --input-type=module - "$work/candidate.json" <<'M2_CANDIDATE_CHECK'
          import {readFileSync} from 'node:fs';
          const bytes=readFileSync(process.argv[2]);
          if(!bytes.length||bytes.length>4096)throw Error('Invalid candidate aggregate bytes');
          const v=JSON.parse(bytes.toString('utf8'));
          import {inspectM2StoredCandidate} from './apps/web/lib/m2-candidate-replay.mjs';
          const receipt=inspectM2StoredCandidate(v);
          if(receipt.codeSha!==process.env.GITHUB_SHA||
             receipt.sourceSha256!==process.env.M2_SOURCE_SHA)
            throw Error('Candidate identity differs from trusted runner');
          M2_CANDIDATE_CHECK
            echo "M2_PRIVATE_CANDIDATE_JSON=$(cat "$work/candidate.json")"
            echo "M2_PRIVATE_CANDIDATE_SHA256=$(sha256sum "$work/candidate.json" | cut -d ' ' -f1)"
            {
              echo '## M2 stored training candidate — NOT an approved model or lock'
              echo 'External CSV unverified during outage; no sealed holdout read, evaluation or forecasts.'
              echo 'The private fitted model is intentionally discarded after emitting fingerprints.'
              echo '~~~json'
              cat "$work/candidate.json"
              echo
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          source_url='https://footbolno.ru/data/league/235-matches.csv'
          if ! curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 45 --max-filesize 2000000 \
            --output "$work/footbolno.csv" "$source_url"; then
            rm -f "$work/footbolno.csv"
            echo 'Direct source DNS/network failed; attempting HTTPS verified host via bounded DoH A records.'
            curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
              --connect-timeout 8 --max-time 15 --max-filesize 4096 \
              -H 'Accept: application/dns-json' \
              --output "$work/dns.json" \
              'https://1.1.1.1/dns-query?name=footbolno.ru&type=A'
            python - "$work/dns.json" "$work/ips.txt" <<'M2_DNS'
          import ipaddress
          import json
          import sys
          from pathlib import Path

          reply = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if type(reply.get('Status')) is not int or reply['Status'] != 0:
              raise SystemExit('FAIL: source DNS-over-HTTPS response refused')
          ips = []
          for answer in reply.get('Answer', []):
              if not isinstance(answer, dict) or answer.get('type') != 1:
                  continue
              if str(answer.get('name', '')).rstrip('.').lower() != 'footbolno.ru':
                  continue
              try:
                  address = ipaddress.ip_address(answer.get('data', ''))
              except ValueError:
                  raise SystemExit('FAIL: invalid source DNS address')
              if address.version != 4 or not address.is_global:
                  raise SystemExit('FAIL: non-public source DNS address')
              if str(address) not in ips:
                  ips.append(str(address))
          if not 1 <= len(ips) <= 4:
              raise SystemExit('FAIL: source DNS cardinality refused')
          Path(sys.argv[2]).write_text('\n'.join(ips) + '\n', encoding='utf-8')
          M2_DNS
            while IFS= read -r ip; do
              if curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
                --resolve "footbolno.ru:443:$ip" \
                --connect-timeout 10 --max-time 45 --max-filesize 2000000 \
                --output "$work/footbolno.csv" "$source_url"; then
                break
              fi
              rm -f "$work/footbolno.csv"
            done < "$work/ips.txt"
          fi
          [[ -s "$work/footbolno.csv" ]]
          [[ "$(wc -c < "$work/footbolno.csv")" -le 2000000 ]]
          actual_sha="$(sha256sum "$work/footbolno.csv" | cut -d ' ' -f1)"
          [[ "$actual_sha" == "$M2_SOURCE_SHA" ]] || {
            echo 'FAIL: downloaded source revision differs from pinned immutable snapshot'; exit 2;
          }
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 45 --max-filesize 200000 \
            --output "$work/openfootball.txt" \
            'https://raw.githubusercontent.com/openfootball/europe/63df627f3c87ce71708f016522ea236cf74332c3/russia/2024-25_ru1.txt'
          [[ -s "$work/openfootball.txt" ]]
          node scripts/m0-cross-source-fixture-reconcile.mjs \
            "$work/footbolno.csv" "$work/openfootball.txt" > "$work/comparison.json"
          node scripts/m1-openfootball-score-gate.mjs "$work/comparison.json" > /dev/null
          python -m football_forecast.research.runner "$work/comparison.json" > "$work/lock.json"
          [[ -s "$work/lock.json" ]]
          # Strictly whitelist the public attestation before writing any job output.
          node --input-type=module - "$work/lock.json" <<'M2_CHECK'
          import {readFileSync} from 'node:fs';
          import {inspectM2PreHoldoutLock} from './apps/web/lib/m2-lock-viewer.mjs';
          const bytes=readFileSync(process.argv[2]);
          if(bytes.byteLength===0||bytes.byteLength>16384)
            throw Error('M2 attestation size refused');
          inspectM2PreHoldoutLock(JSON.parse(bytes.toString('utf8')));
          M2_CHECK
          # Aggregate-only machine-readable markers for independent GitHub log verification.
          printf 'M2_LOCK_ATTESTATION_JSON=%s\n' "$(cat "$work/lock.json")"
          printf 'M2_LOCK_ATTESTATION_SHA256=%s\n' "$(sha256sum "$work/lock.json" | cut -d ' ' -f1)"
          {
            echo '## M2 manual train-only candidate lock (not yet immutable)'
            echo 'Train-only: holdout role counts checked, no holdout labels/IDs read, zero DB writes.'
            echo 'CC BY 4.0 Footbolno — https://footbolno.ru/otkrytye-dannye'
            echo 'Pinned OpenFootball reference — https://github.com/openfootball/europe'
            echo 'Source agreement does not prove independent original authorship or historical as-of.'
            echo '~~~json'
            cat "$work/lock.json"
            echo
            echo '~~~'
            echo "Attestation SHA-256: $(sha256sum "$work/lock.json" | cut -d ' ' -f1)"
            echo 'DO NOT open sealed 2025/26 holdout before independently reviewing and anchoring this evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
