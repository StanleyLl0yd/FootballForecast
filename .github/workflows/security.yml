name: Security
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read, pull-requests: read}
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned 2026-10-17
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned 2026-10-17
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 pinned 2026-10-17
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Production dependency audit (enforced)
        run: npm audit --omit=dev --audit-level=high
      - name: Test exact advisory exception, dev-only reachability and fail-closed audit semantics
        run: node --check scripts/m0-audit-dev-exception.mjs && node --test tests/m0-audit-dev-exception.test.mjs
      - name: Enforce full audit with only known unpatched dev-only braces advisory
        run: node scripts/m0-audit-dev-exception.mjs
