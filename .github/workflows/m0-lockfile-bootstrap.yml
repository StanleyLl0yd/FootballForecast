name: M0 one-time lockfile bootstrap
on:
  push:
    branches: [feat/m0-reproducible-web]
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'StanleyLl0yd/FootballForecast' && github.ref == 'refs/heads/feat/m0-reproducible-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resolve and commit reproducible lockfile once
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            echo "Lockfile already present; nothing to generate."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock npm dependency tree"
          git push origin HEAD:refs/heads/feat/m0-reproducible-web
