name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned 2026-10-17
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 pinned 2026-10-17
        with: {python-version: '3.13'}
      - name: Test core
        run: python -m pip install -e 'ml[test]' && python -m pytest ml/tests -q && python -m ruff check ml
      - name: PostgreSQL RLS and immutable-forecast integration
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At -c "show server_version_num" | grep -E '^17[0-9]{4}$'
          cat database/tests/0000_ci_supabase_stub.sql database/migrations/0001_foundation.sql database/tests/0001_rls_and_forecasts.sql database/migrations/0002_public_read.sql database/tests/0002_public_read.sql database/migrations/0003_match_fk_indexes.sql database/tests/0003_match_fk_indexes.sql database/migrations/0004_match_status_scores.sql database/migrations/0005_m1_private_source_staging.sql database/migrations/0006_m1_guarded_canonical_promotion.sql database/migrations/0007_m1_private_mapping_fk_indexes.sql database/migrations/0008_m1_private_snapshot_revision_review.sql database/migrations/0009_m1_safe_current_refresh.sql database/tests/0014_m1_safe_current_refresh_access.sql database/tests/0012_m1_revision_preview_access.sql database/tests/0010_m1_canonical_promotion.sql database/tests/0011_m1_mapping_fk_indexes.sql database/tests/0005_live_anon_posture.sql database/tests/0006_live_immutable_ledger.sql database/tests/0007_live_public_surface.sql database/tests/0008_match_status_scores.sql database/tests/0009_m1_private_source_staging.sql |
            docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres
      - name: Reject unexpected publicly exposed tables, views, sequences and routines
        shell: bash
        run: |
          bash -n scripts/m0-public-surface-negative-ci.sh
          bash scripts/m0-public-surface-negative-ci.sh "${{ job.services.postgres.id }}"
      - name: Validate PostgreSQL restore script syntax
        run: bash -n scripts/m0-isolated-restore-ci.sh
      - name: Backup and restore into distinct disposable PostgreSQL 17 server
        shell: bash
        run: bash scripts/m0-isolated-restore-ci.sh "${{ job.services.postgres.id }}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 pinned
        with: {node-version: '22'}
      - name: Commit and replay 720 synthetic source rows against disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            node tests/m1-stage-sql-fixture.mjs |
              docker exec -i "${{ job.services.postgres.id }}" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres > /dev/null
          done
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At -c 'select count(*) from ff_private.ff_ingest_matches' | grep -x '720'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At -c 'select count(*) from ff_private.ff_ingest_snapshots' | grep -x '1'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At -c 'select count(*) from public.ff_matches' | grep -x '2'
      - name: Promote synthetic M1 fixtures with stable links and no invented kickoffs
        shell: bash
        run: |
          set -euo pipefail
          pre_forecasts="$(docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At -c 'select count(*) from public.ff_forecasts')"
          for pass in 1 2; do
            docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At \
              -c "select ff_private.ff_promote_footbolno_snapshot(id)->>'public_rows_linked' from ff_private.ff_ingest_snapshots" | grep -x '480'
          done
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At \
            -c "select count(*) from ff_private.ff_published_fixture_links" | grep -x '480'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At \
            -c "select count(*) from ff_private.ff_provider_team_links" | grep -x '16'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At \
            -c "select count(*) from public.ff_source_records" | grep -x '480'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At \
            -c "select count(*) from public.ff_matches" | grep -x '482'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At \
            -c "select count(*) from public.ff_forecasts" | grep -x "$pre_forecasts"
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At \
            -c "select count(*) from public.ff_source_records where published_at is not null" | grep -x '0'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At \
            -c "select count(*) from ff_private.ff_ingest_matches where kickoff_at is null" | grep -x '240'
      - name: Verify immutable M1 source revision review with synthetic score and time changes
        shell: bash
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < database/tests/0013_m1_revision_preview_synthetic.sql
      - name: Verify guarded M1 current-season refresh and immutable audit in rolled-back PG17
        shell: bash
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < database/tests/0015_m1_safe_current_refresh_synthetic.sql
      - name: Test anonymous HTTP against disposable real PostgREST v14
        shell: bash
        run: bash -n scripts/m0-disposable-postgrest-ci.sh && bash scripts/m0-disposable-postgrest-ci.sh "${{ job.services.postgres.id }}"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned 2026-10-17
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 pinned 2026-10-17
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax-check non-gating production HTTP probe
        run: node --check scripts/smoke-production.mjs
      - name: Reject non-owner GitHub identity fixtures
        run: npm run test:auth
      - name: Prevent WebDriver duplicate Firefox session creation
        run: node --check scripts/smoke-cross-browser.mjs && node --test tests/m0-webdriver-session.test.mjs
      - name: Verify browser connectivity probes are read-only and privacy-preserving
        run: node --experimental-strip-types --test apps/web/tests/connectivity.test.mjs apps/web/tests/offline-carrier-check.test.mjs
      - name: Test manual encrypted export fail-closed contract with synthetic mocks
        run: bash -n scripts/m0-manual-encrypted-export.sh && node --test tests/m0-manual-encrypted-export.test.mjs
      - name: Enforce owner-only offline encrypted restore preflight (synthetic mocks)
        run: bash -n scripts/m0-manual-isolated-restore.sh && node --test tests/m0-manual-isolated-restore.test.mjs
      - name: Validate anonymous Supabase REST integration without credentials
        run: npm run test:public-data
      - name: Validate real-score recent-results feed without provider mutations
        run: node --experimental-strip-types --test apps/web/tests/public-results.test.mjs
      - name: Validate public forecast archive schema and read-only REST
        run: npm run test:archive
      - name: Enforce free-only source register and zero-cost rank evidence
        run: node --test tests/m0-free-source-policy.test.mjs
      - name: Verify no-cost publisher metadata probe cannot download match CSV rows
        run: node --check scripts/m0-footbolno-metadata.mjs && node --test tests/m0-footbolno-metadata.test.mjs
      - name: Validate ephemeral hash-pinned RPL season coverage inspector without provider rows
        run: node --check scripts/m0-footbolno-csv-aggregate.mjs && node --test tests/m0-footbolno-csv-aggregate.test.mjs
      - name: Validate private M1 PostgreSQL stage importer without real records
        run: node --check scripts/m1-stage-import.mjs && node --test tests/m1-stage-import.test.mjs
      - name: Validate M1 pinned OpenFootball full-score source gate without private data
        run: node --check scripts/m1-openfootball-score-gate.mjs && node --test tests/m1-openfootball-score-gate.test.mjs
      - name: Verify manual-only M1 source import and private revision summary
        run: node --check scripts/m1-revision-report.mjs && node --test tests/m1-private-stage-workflow.test.mjs tests/m1-revision-report.test.mjs
      - name: Verify safe M1 protected GitHub Environment setup
        run: |
          node --test tests/m1-secret-setup-script.test.mjs
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile("scripts/Set-M1PrivateImportSecrets.ps1", [ref]$null, [ref]$errors)
              if ($errors.Count -gt 0) { exit 1 }
            '
          fi
      - name: Verify published M1 milestones and README reflect actual data foundation
        run: node --test tests/m1-status-consistency.test.mjs
      - name: Verify registry-driven public source catalog without activated providers
        run: node --test apps/web/tests/data-catalog.test.mjs
      - name: Test offline cross-provider score, status, venue and temporal accuracy logic
        run: node --check scripts/m0-multi-source-quality.mjs && node --check scripts/m0-multi-source-core.mjs && node --test tests/m0-multi-source-quality.test.mjs tests/m0-source-core-parity.test.mjs
      - name: Verify pinned 2026 RPL 16-fixture external evidence and non-approval bounds
        run: node --test tests/m0-sportscore-filtered-evidence.test.mjs
      - name: Validate source-verified SportScore RPL competition slug and filtered research
        run: node --check scripts/m0-sportscore-filtered-rpl-research.mjs && node --test tests/m0-sportscore-filtered-rpl-research.test.mjs
      - name: Validate bounded SportScore free day probe and reject unverified coverage
        run: node --check scripts/m0-sportscore-day-research.mjs && node --test tests/m0-sportscore-day-research.test.mjs
      - name: Verify 2025/26 Wikipedia matrix parser without holdout data or network
        run: python3 -m unittest discover -s tests -p test_m0_wikipedia_rpl_holdout_matrix.py
      - name: Validate historical fixture and score-annotation diagnostics without provider data
        run: node --check scripts/m0-scoreline-histogram-crosscheck.mjs && node --test tests/m0-fixture-structure.test.mjs tests/m0-source-quality.test.mjs tests/m0-fixture-reconcile.test.mjs tests/m0-openfootball-evidence.test.mjs tests/m0-scoreline-histogram-crosscheck.test.mjs tests/m0-cross-source-fixture-reconcile.test.mjs
      - name: Validate minimum RPL scope against pinned evidence
        run: node --test tests/m0-minimal-rpl-scope.test.mjs
      - name: Validate pinned research-only Footbolno coverage quarantine matrix
        run: node --test tests/m0-footbolno-pinned-evidence.test.mjs
      - name: Pin 2024/25 aggregate parity and OpenFootball 2025-27 coverage absence
        run: node --test tests/m0-rpl-2024-25-minimum-crosscheck.test.mjs
      - name: Deny unresolved free SportScore API terms and restricted UEFA bulk extraction
        run: node --test tests/m0-current-rpl-terms-review.test.mjs
      - name: Verify temporary RPL three-season CSV counts and streaming response limit
        run: node --test apps/web/tests/rpl-three-season-csv-audit.test.mjs
      - name: Enforce bounded opt-in free Footbolno and SportScore research previews
        run: node --test apps/web/tests/source-preview.test.mjs
      - name: Keep Wikimedia holdout candidate unapproved and historical API access constrained
        run: node --test tests/m0-wikimedia-holdout-research.test.mjs
      - name: Detect 2025/26 RPL publisher-aggregate disagreement without source promotion
        run: node --test tests/m0-rpl-2025-26-aggregate-crosscheck.test.mjs
      - name: Verify current RPL 11-round editorial totals without inferring source rights
        run: node --test tests/m0-rpl-2026-27-editorial-crosscheck.test.mjs
      - name: Verify restricted Open Matchday 2026 RPL coverage is not promoted as independent data
        run: node --test tests/m0-open-matchday-source-coverage.test.mjs
      - name: Verify non-mutating PostgREST HTTP refusal contract (synthetic mocks only)
        run: node --test tests/m0-rest-denials.test.mjs
      - name: Verify localhost real-PostgREST operation sequence and deny-contract mocks
        run: node --check scripts/m0-disposable-postgrest.mjs && node --test tests/m0-disposable-postgrest.test.mjs
      - run: npm run lint && npm run typecheck && npm run build
      - name: Fail-closed production server and Chrome browser smoke
        env:
          FF_BROWSER_SMOKE: '1'
        run: npm run smoke:auth

  production-smoke:
    # Diagnostic canary only; external service outages must not bypass or
    # deadlock the six required exact-head PR checks.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned 2026-10-17
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 pinned 2026-10-17
        with: {node-version: '22'}
      - name: Check deployed public site from outside Vercel
        run: node scripts/smoke-production.mjs

  browser-compatibility:
    # Production cross-browser diagnostics, independent from six required PR checks.
    # These browser binaries are preinstalled in the Ubuntu 24.04 hosted image.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '22'}
      - name: Verify production on stable Firefox and Microsoft Edge
        run: node scripts/smoke-cross-browser.mjs

  safari-compatibility:
    # macOS standard hosted runners are free for public repositories.
    # Separate non-gating real Safari/WebKit production diagnostic.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '22'}
      - name: Enable standard Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Check live anonymous public pages and denied administrator path
        run: node scripts/smoke-safari.mjs
