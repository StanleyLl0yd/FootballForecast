name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned 2026-10-17
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 pinned 2026-10-17
        with: {python-version: '3.13'}
      - name: Test core
        run: python -m pip install -e 'ml[test]' && python -m pytest ml/tests -q && python -m ruff check ml
      - name: PostgreSQL RLS and immutable-forecast integration
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -At -c "show server_version_num" | grep -E '^17[0-9]{4}$'
          cat database/tests/0000_ci_supabase_stub.sql database/migrations/0001_foundation.sql database/tests/0001_rls_and_forecasts.sql database/migrations/0002_public_read.sql database/tests/0002_public_read.sql database/migrations/0003_match_fk_indexes.sql database/tests/0003_match_fk_indexes.sql |
            docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres
      - name: Backup and restore into distinct disposable PostgreSQL 17 server
        shell: bash
        run: bash scripts/m0-isolated-restore-ci.sh "${{ job.services.postgres.id }}"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned 2026-10-17
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 pinned 2026-10-17
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax-check non-gating production HTTP probe
        run: node --check scripts/smoke-production.mjs
      - name: Reject non-owner GitHub identity fixtures
        run: npm run test:auth
      - name: Verify browser connectivity probes are read-only and privacy-preserving
        run: node --experimental-strip-types --test apps/web/tests/connectivity.test.mjs apps/web/tests/offline-carrier-check.test.mjs
      - name: Validate anonymous Supabase REST integration without credentials
        run: npm run test:public-data
      - name: Validate public forecast archive schema and read-only REST
        run: npm run test:archive
      - name: Validate historical fixture and score-annotation diagnostics without provider data
        run: node --test tests/m0-fixture-structure.test.mjs tests/m0-source-quality.test.mjs tests/m0-fixture-reconcile.test.mjs
      - name: Verify non-mutating PostgREST HTTP refusal contract (synthetic mocks only)
        run: node --test tests/m0-rest-denials.test.mjs
      - run: npm run lint && npm run typecheck && npm run build
      - name: Fail-closed production server and Chrome browser smoke
        env:
          FF_BROWSER_SMOKE: '1'
        run: npm run smoke:auth

  production-smoke:
    # Diagnostic canary only; external service outages must not bypass or
    # deadlock the six required exact-head PR checks.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned 2026-10-17
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 pinned 2026-10-17
        with: {node-version: '22'}
      - name: Check deployed public site from outside Vercel
        run: node scripts/smoke-production.mjs

  browser-compatibility:
    # Production cross-browser diagnostics, independent from six required PR checks.
    # These browser binaries are preinstalled in the Ubuntu 24.04 hosted image.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '22'}
      - name: Verify production on stable Firefox and Microsoft Edge
        run: node scripts/smoke-cross-browser.mjs

  safari-compatibility:
    # macOS standard hosted runners are free for public repositories.
    # Separate non-gating real Safari/WebKit production diagnostic.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '22'}
      - name: Enable standard Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Check live anonymous public pages and denied administrator path
        run: node scripts/smoke-safari.mjs
