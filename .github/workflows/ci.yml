name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-10-16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 verified 2026-10-16
        with: {python-version: '3.13'}
      - name: Test core
        run: python -m pip install -e 'ml[test]' && python -m pytest ml/tests -q && python -m ruff check ml
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-10-16
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4 verified 2026-10-16
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund # LOCKFILE TODO: switch to npm ci after committing package-lock.json
      - run: npm run lint && npm run typecheck && npm run build
