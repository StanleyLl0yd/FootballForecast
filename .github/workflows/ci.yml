name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned 2026-10-17
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 pinned 2026-10-17
        with: {python-version: '3.13'}
      - name: Test core
        run: python -m pip install -e 'ml[test]' && python -m pytest ml/tests -q && python -m ruff check ml
      - name: PostgreSQL RLS and immutable-forecast integration
        shell: bash
        run: |
          cat database/tests/0000_ci_supabase_stub.sql database/migrations/0001_foundation.sql database/tests/0001_rls_and_forecasts.sql database/migrations/0002_public_read.sql database/tests/0002_public_read.sql database/migrations/0003_match_fk_indexes.sql database/tests/0003_match_fk_indexes.sql |
            docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres
      - name: Backup and restore disposable PostgreSQL fixture
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" bash -euc '
            pg_dump -U postgres -d postgres -Fc -n auth -n ff_private -n public -f /tmp/ff_m0_fixture.dump
            sha256sum /tmp/ff_m0_fixture.dump
            createdb -U postgres ff_restore_ci
            # Fresh PostgreSQL databases include public by default; drop that empty schema
            # so the backup can restore its original ACLs and ownership cleanly.
            psql -U postgres -d ff_restore_ci -v ON_ERROR_STOP=1 -c "DROP SCHEMA public;"
            pg_restore -U postgres --no-owner --exit-on-error -d ff_restore_ci /tmp/ff_m0_fixture.dump
          '
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d ff_restore_ci < database/tests/0004_restore_validation.sql

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned 2026-10-17
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 pinned 2026-10-17
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Reject non-owner GitHub identity fixtures
        run: npm run test:auth
      - name: Validate anonymous Supabase REST integration without credentials
        run: npm run test:public-data
      - run: npm run lint && npm run typecheck && npm run build
      - name: Fail-closed production server and Chrome browser smoke
        env:
          FF_BROWSER_SMOKE: '1'
        run: npm run smoke:auth

  production-smoke:
    # Diagnostic canary only; external service outages must not bypass or
    # deadlock the six required exact-head PR checks.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned 2026-10-17
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 pinned 2026-10-17
        with: {node-version: '22'}
      - name: Check deployed public site from outside Vercel
        run: node scripts/smoke-production.mjs
