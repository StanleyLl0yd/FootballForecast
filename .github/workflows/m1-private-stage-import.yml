name: M1 protected free Footbolno ingest and safe RPL refresh
on:
  schedule:
    # Twice daily, off the hour. GitHub schedules run from protected default main.
    - cron: '17 6,18 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/m1-private-stage-import.yml']
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Optional manual override: STAGE_FOOTBOLNO_PRIVATE'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: m1-private-source-import
  cancel-in-progress: false
jobs:
  protected-import:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'STAGE_FOOTBOLNO_PRIVATE'))
    runs-on: ubuntu-latest
    environment: m1-source-import
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Verify importer and source normalizer with synthetic data
        run: |
          node --check scripts/m1-footbolno-normalize.mjs
          node --check scripts/m1-stage-import.mjs
          node --check scripts/m1-revision-report.mjs
          node --check scripts/m1-autonomous-refresh.mjs
          node --test tests/m1-footbolno-normalize.test.mjs tests/m1-stage-import.test.mjs tests/m1-revision-report.test.mjs tests/m1-autonomous-refresh.test.mjs
      - name: Prepare PostgreSQL client before any secrets are exposed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq >/dev/null
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client >/dev/null
          fi
          psql --version
      - name: Verify pinned Supabase root CA before secrets are exposed
        shell: bash
        run: |
          set -euo pipefail
          ca="security/certs/supabase-root-2021-ca.crt"
          test -s "$ca"
          fingerprint="$(openssl x509 -in "$ca" -outform DER | sha256sum | cut -d ' ' -f1)"
          [[ "$fingerprint" == "807025ad50d4ed219d2c9c7d299c004f824eb00cf7f65afef607d07b72e6cafa" ]] || {
            echo 'FAIL: pinned Supabase CA fingerprint mismatch'
            exit 2
          }
          openssl x509 -in "$ca" -noout -checkend 86400 >/dev/null
      - name: Validate live source then stage into protected PostgreSQL
        shell: bash
        env:
          PGHOST: ${{ secrets.M1_PGHOST }}
          PGUSER: ${{ secrets.M1_PGUSER }}
          PGDATABASE: ${{ secrets.M1_PGDATABASE }}
          PGPASSWORD: ${{ secrets.M1_PGPASSWORD }}
          M1_PGROOTCERT_B64: ${{ secrets.M1_PGROOTCERT_B64 }}
          PGPORT: '5432'
          PGSSLMODE: verify-full
          FF_M1_DB_WRITE_ENABLED: '1'
        run: |
          set -euo pipefail
          umask 077
          command -v psql >/dev/null || { echo 'FAIL: PostgreSQL client unavailable'; exit 2; }
          if [[ -z "$PGHOST" || -z "$PGUSER" || -z "$PGDATABASE" || -z "$PGPASSWORD" ]]; then
            echo 'FAIL: protected PostgreSQL connection value missing'
            exit 2
          fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -m 0700 "$work/private"
          if [[ -n "$M1_PGROOTCERT_B64" ]]; then
            printf '%s' "$M1_PGROOTCERT_B64" | base64 --decode > "$work/ca.crt"
          else
            cp security/certs/supabase-root-2021-ca.crt "$work/ca.crt"
          fi
          fingerprint="$(openssl x509 -in "$work/ca.crt" -outform DER | sha256sum | cut -d ' ' -f1)"
          [[ "$fingerprint" == "807025ad50d4ed219d2c9c7d299c004f824eb00cf7f65afef607d07b72e6cafa" ]] || {
            echo 'FAIL: Supabase CA fingerprint mismatch'
            exit 2
          }
          openssl x509 -in "$work/ca.crt" -noout -checkend 86400 >/dev/null
          export PGSSLROOTCERT="$work/ca.crt"
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 45 --max-filesize 2000000 \
            --output "$work/footbolno.csv" \
            'https://footbolno.ru/data/league/235-matches.csv'
          test -s "$work/footbolno.csv"
          test "$(wc -c < "$work/footbolno.csv")" -le 2000000
          retrieved="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/m1-footbolno-normalize.mjs \
            "$work/footbolno.csv" "$retrieved" "$work/private" > "$work/quality.json"
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 45 --max-filesize 200000 \
            --output "$work/openfootball-2024-25.txt" \
            'https://raw.githubusercontent.com/openfootball/europe/63df627f3c87ce71708f016522ea236cf74332c3/russia/2024-25_ru1.txt'
          test -s "$work/openfootball-2024-25.txt"
          node scripts/m0-cross-source-fixture-reconcile.mjs \
            "$work/footbolno.csv" "$work/openfootball-2024-25.txt" > "$work/aggregate-crosscheck.json"
          node scripts/m1-openfootball-score-gate.mjs \
            "$work/aggregate-crosscheck.json" > "$work/score-gate.json"
          node scripts/m1-stage-import.mjs \
            "$work/private/manifest.json" \
            "$work/private/rpl-2024-2025.jsonl" \
            "$work/private/rpl-2025-2026.jsonl" \
            "$work/private/rpl-2026-2027.jsonl"
          node scripts/m1-stage-import.mjs \
            "$work/private/manifest.json" \
            "$work/private/rpl-2024-2025.jsonl" \
            "$work/private/rpl-2025-2026.jsonl" \
            "$work/private/rpl-2026-2027.jsonl" --commit
          hash="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!/^[a-f0-9]{64}$/.test(m.sourceFileSha256))process.exit(2);process.stdout.write(m.sourceFileSha256)" "$work/private/manifest.json")"
          if ! psql -X -qAt -v ON_ERROR_STOP=1 -v VERBOSITY=terse \
            -c "select ff_private.ff_preview_footbolno_revision(s.id) from ff_private.ff_ingest_snapshots s join public.ff_sources src on src.id=s.source_id where src.name='Footbolno' and s.source_sha256='$hash'" \
            > "$work/private/revision.json" 2>/dev/null; then
            echo 'FAIL: private source committed, but revision review unavailable'
            exit 2
          fi
          node scripts/m1-revision-report.mjs "$work/private/revision.json" \
            > "$work/revision-summary.json" || {
              echo 'FAIL: private source committed, but revision report invalid'
              exit 2
            }
          cat "$work/revision-summary.json"
          decision="$(node scripts/m1-autonomous-refresh.mjs decision "$work/revision-summary.json")"
          case "$decision" in
            NO_CHANGE)
              printf '%s\n' '{"kind":"M1_GUARDED_REFRESH","outcome":"UNCHANGED","publicWritesPerformed":0}' > "$work/refresh-summary.json"
              ;;
            REVIEW_REQUIRED)
              printf '%s\n' '{"kind":"M1_GUARDED_REFRESH","outcome":"PRIVATE_REVIEW_REQUIRED","publicWritesPerformed":0}' > "$work/refresh-summary.json"
              ;;
            SAFE_CURRENT_ONLY)
              # The DB transaction independently repeats all constraints and
              # either fully commits a safe current-season change or rolls back.
              if ! psql -X -qAt -v ON_ERROR_STOP=1 -v VERBOSITY=terse \
                -c "select ff_private.ff_apply_safe_current_refresh(s.id) from ff_private.ff_ingest_snapshots s join public.ff_sources src on src.id=s.source_id where src.name='Footbolno' and s.source_sha256='$hash'" \
                > "$work/private/refresh-result.json" 2>/dev/null; then
                echo 'FAIL: private source committed, guarded current-only update declined'
                exit 2
              fi
              node scripts/m1-autonomous-refresh.mjs outcome \
                "$work/private/refresh-result.json" > "$work/refresh-summary.json" || {
                  echo 'FAIL: source stage committed, guarded refresh result invalid'
                  exit 2
                }
              ;;
            *)
              echo 'FAIL: unsafe M1 autonomous decision'
              exit 2
              ;;
          esac
          cat "$work/refresh-summary.json"
          {
            echo '## M1 private Footbolno ingestion'
            echo 'Source: Footbolno, CC BY 4.0 - https://footbolno.ru/otkrytye-dannye'
            echo 'Validated all three RPL seasons and committed into ff_private only.'
            echo 'No provider rows, credentials or raw artifacts were retained.'
            echo 'Only guarded current-season changes can be published; no model training.'
            echo
            echo '~~~json'
            cat "$work/quality.json"
            echo '~~~'
            echo '### M1 private revision review (aggregate only; never auto-published)'
            echo '~~~json'
            cat "$work/revision-summary.json"
            echo '~~~'
            echo '### Protected current-season refresh outcome'
            echo '~~~json'
            cat "$work/refresh-summary.json"
            echo '~~~'
            echo '### Pinned OpenFootball 2024/25 match-level score gate'
            echo '~~~json'
            cat "$work/score-gate.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
