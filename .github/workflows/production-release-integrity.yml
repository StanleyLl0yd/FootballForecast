name: Production Release Integrity (read-only)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: production-release-integrity
  cancel-in-progress: false
jobs:
  verify:
    # A strict owner/issue/command gate enables manual operation through an
    # authenticated issue comment even without Actions workflow-dispatch API.
    if: >-
      github.repository == 'StanleyLl0yd/FootballForecast' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.actor == 'StanleyLl0yd' &&
          github.event.issue.number == 266 &&
          !github.event.issue.pull_request &&
          github.event.comment.user.id == 131160519 &&
          github.event.comment.user.login == 'StanleyLl0yd' &&
          github.event.comment.author_association == 'OWNER' &&
          github.event.comment.body == '/release-integrity-check'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 pinned
        with: {node-version: '22'}
      - name: Compare all three live aliases with current protected main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-release.mjs
