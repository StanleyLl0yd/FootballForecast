name: M3 owner-only private development study (read-only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'M3_DEV_AGGREGATE_ONLY — no holdout or publication'
        required: true
        type: string
  issue_comment:
    types: [created]
permissions: {contents: read}
concurrency:
  group: m3-owner-development-study
  cancel-in-progress: false
jobs:
  private-development:
    if: >-
      github.repository == 'StanleyLl0yd/FootballForecast' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'StanleyLl0yd' &&
      (
        (github.event_name == 'workflow_dispatch' &&
         inputs.confirmation == 'M3_DEV_AGGREGATE_ONLY') ||
        (github.event_name == 'issue_comment' &&
         github.event.action == 'created' &&
         github.event.issue.number == 271 &&
         !github.event.issue.pull_request &&
         github.event.comment.user.login == 'StanleyLl0yd' &&
         github.event.comment.author_association == 'OWNER' &&
         github.event.comment.body == '/m3-dev-aggregate-only')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: m1-source-import
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - name: Install pinned database client
        run: python -m pip install -e ./ml 'psycopg[binary]==3.3.6'
      - name: Execute protected aggregate-only historical study
        shell: bash
        env:
          PGHOST: ${{ secrets.M1_PGHOST }}
          PGUSER: ${{ secrets.M1_PGUSER }}
          PGDATABASE: ${{ secrets.M1_PGDATABASE }}
          PGPASSWORD: ${{ secrets.M1_PGPASSWORD }}
          M1_PGROOTCERT_B64: ${{ secrets.M1_PGROOTCERT_B64 }}
          PYTHONPATH: ml/src
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == 'StanleyLl0yd/FootballForecast' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_ACTOR" == 'StanleyLl0yd' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          for name in PGHOST PGUSER PGDATABASE PGPASSWORD; do
            [[ -n "${!name:-}" ]] || { echo 'FAIL: protected DB credentials missing'; exit 2; }
          done
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          if [[ -n "${M1_PGROOTCERT_B64:-}" ]]; then
            printf '%s' "$M1_PGROOTCERT_B64" | base64 --decode > "$work/ca.crt"
          else
            cp security/certs/supabase-root-2021-ca.crt "$work/ca.crt"
          fi
          fingerprint="$(openssl x509 -in "$work/ca.crt" -outform DER | sha256sum | cut -d ' ' -f1)"
          [[ "$fingerprint" == '807025ad50d4ed219d2c9c7d299c004f824eb00cf7f65afef607d07b72e6cafa' ]] || {
            echo 'FAIL: untrusted Supabase CA'; exit 2;
          }
          openssl x509 -in "$work/ca.crt" -noout -checkend 86400 > /dev/null
          export PGSSLROOTCERT="$work/ca.crt"
          python scripts/m3-owner-dev-study.py > "$work/receipt.json"
          python - "$work/receipt.json" <<'RECEIPT'
          import json, os, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          if not 200 <= len(data) <= 2000:
              raise SystemExit('FAIL: invalid bounded receipt')
          receipt = json.loads(data)
          fields = {'schemaVersion', 'kind', 'revisionSha', 'querySha256',
                    'aggregateResultsSha256', 'validatedFolds',
                    'candidateScoredMatches', 'withheldValidationCandidates',
                    'poissonBetterLogLossFolds', 'poissonBetterBrierFolds',
                    'poissonBetterRpsFolds', 'classification',
                    'holdout2025_26Read', 'privateRowsExported',
                    'modelPersisted', 'publicForecastsWritten', 'acceptanceGranted'}
          if (set(receipt) != fields or receipt['revisionSha'] != os.environ['GITHUB_SHA']
              or receipt['validatedFolds'] != 5 or receipt['candidateScoredMatches'] != 1197
              or receipt['withheldValidationCandidates'] != 3
              or any(receipt[k] is not False for k in ('holdout2025_26Read',
                      'privateRowsExported', 'modelPersisted',
                      'publicForecastsWritten', 'acceptanceGranted'))):
              raise SystemExit('FAIL: untrusted private study receipt')
          print('M3_PRIVATE_STUDY_DIGEST_SHA256=' + receipt['aggregateResultsSha256'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## M3 private seven-season research, not milestone acceptance\n')
              out.write('Five chronological folds, 1,197 provisional validation candidates; '
                        'no 2025/26 holdout, data writes, model release or exposed fixtures.\n')
              out.write('Aggregate output digest: `' + receipt['aggregateResultsSha256'] + '`\n')
              out.write('Poisson lower Log Loss in ' + str(receipt['poissonBetterLogLossFolds']) + '/5 folds.\n')
          RECEIPT
